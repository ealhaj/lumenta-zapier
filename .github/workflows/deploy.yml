name: Zapier app CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      # zapier validate runs the platform schema check against index.js.
      # No deploy key needed — `validate` is read-only.
      - run: npx zapier validate

  push:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      # zapier push uploads the new version to Zapier's infra. The
      # deploy key is created in the Zapier developer dashboard and
      # added to repo secrets. Breaking changes require zapier migrate
      # (run manually after this step) to move existing Zaps.
      - run: npx zapier push
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
